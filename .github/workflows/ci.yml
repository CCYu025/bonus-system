name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # src/generated/prisma is gitignored (see docs/database.md) — must
      # regenerate before typecheck/build/test can resolve @/generated/prisma/client.
      - run: npx prisma generate

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm test
