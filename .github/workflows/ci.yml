name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bonus_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # test/global-setup.ts and e2e/global-setup.ts derive isolated per-run
      # URLs from this by pinning the `schema` query param (see test/db-url.ts).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bonus_system

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # src/generated/prisma is gitignored (see docs/database.md) — must
      # regenerate before typecheck/build/test can resolve @/generated/prisma/client.
      - run: npx prisma generate

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm test
